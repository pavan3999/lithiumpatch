name: lithium

on:
  push:
  workflow_dispatch:

jobs:
  patch:
    name: patch
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install zipalign
        run: sudo apt update && sudo apt install -y zipalign
      - name: Write keystore
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/default.jks
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        if: env.KEYSTORE_BASE64
      - name: Prevent idle timeout
        run: |
          while true; do
            echo "still alive..."
            sleep 60
          done &
      - name: Download app
        run: go generate ./app
      - name: Download dictionaries
        run: go generate ./dict/edgedict
        continue-on-error: true
      - name: Patch app
        run: GOMAXPROCS=2 go run . app/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-patched
          path: app/*.patched.resigned.apk
          compression-level: 0
